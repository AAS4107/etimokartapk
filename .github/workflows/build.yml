name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Buildozer kurulumu
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.37"

      - name: Debug APK derle
        run: |
          # Test APK'sı için API 35 daha güvenli; Play Store sürümü (AAB) için 36 kullan.
          sed -i 's/^android.api = 36/android.api = 35/' buildozer.spec
          buildozer -v android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: etimokart-apk
          path: bin/*.apk
